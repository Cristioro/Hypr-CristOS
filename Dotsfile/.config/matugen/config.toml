[config]
mode = "dark"
type = "scheme-tonal-spot"

[templates.cava]
input_path = "~/.config/matugen/templates/cava"
output_path = "~/.config/cava/config"

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'

[templates.fastfetch]
input_path = "~/.config/matugen/templates/fastfetch.jsonc"
output_path = "~/.config/fastfetch/config.jsonc"

[templates.hyprland_lua]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/config/colors.lua"
post_hook = 'hyprctl reload'

[templates.hyprquickpaper]
input_path = "~/.config/matugen/templates/hyprquickpaper.json"
output_path = "~/.config/quickshell/hyprquickpaper-copy/config.json"

# Variante parcheada (webp, rutas con espacios, notificaciones): solo color de borde
[templates.hyprquickpaper_variant]
input_path = "~/.config/matugen/templates/hyprquickpaper-colors.json"
output_path = "~/.config/quickshell/hyprquickpaper/colors.json"

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = "kitty +kitten themes --reload-in=all Matugen"

[templates.mako]
input_path = '~/.config/matugen/templates/mako'
output_path = '~/.config/mako/config'
post_hook = 'makoctl reload'

[templates.midnight_discord]
input_path = "~/.config/matugen/templates/midnight.matugen.theme.css"
output_path = "~/.config/BetterDiscord/themes/midnight.matugen.theme.css"

[templates.midnight_discordVesktop]
input_path = "~/.config/matugen/templates/midnight.matugen.theme.css"
output_path = "~/.config/vesktop/themes/midnight.matugen.theme.css"


[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors.rasi"
post_hook = '~/.config/hypr/scripts/transparency.sh rofi-apply'

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.nvim]
input_path = '~/.config/matugen/templates/colors_neopywal.vim'
output_path = '~/.cache/wallust/colors_neopywal.vim'
post_hook = 'pkill -SIGUSR1 nvim'

# VS Code matugen extension
[templates.vscode-raw]
input_path = '~/.config/matugen/templates/vscode/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = '~/.config/matugen/templates/vscode/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

# GTK 3 / GTK 4 (apps GTK: Thunar, diálogos, selectores de archivos...)
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = '~/.config/matugen/hooks/gtk-mode.sh'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/hooks/gtk-mode.sh'

# /home/kaiserpc/.config/hypr/hyprlock.conf

background {
    monitor =
    path = ~/.cache/rofi/current_wallpaper.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

general {
    screencopy_mode = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 10, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Profile photo
image {
    monitor =
    path = ~/.config/hypr/user.png
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 250
    rounding = -1
    position = 0, 60
    halign = center
    valign = center
}

# Fecha (usa formato nativo en lugar de cmd cada segundo)
label {
    monitor =
    text = {time:%A, %B %d}
    color = rgba(216, 222, 233, 0.70)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Hora (formato nativo, sin spawn de shell)
label {
    monitor =
    text = {time:%H:%M}
    color = rgba(216, 222, 233, 0.70)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text =     $USER
    color = rgba(216, 222, 233, 0.80)
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 350, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="#ffffff99">Start typing pass...</span></i>
    hide_input = false
    position = 0, -180
    halign = center
    valign = center
}

# Canción actual (solo si usas nowplaying.sh)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/hyprlock/nowplaying.sh
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 10, 20
    halign = left
    valign = bottom
}

image {
    monitor =
    path = ~/.config/hypr/hyprlock/album_art.jpg
    onclick = ~/.config/hypr/hyprlock/nowplaying.sh --toggle
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 150
    rounding = 14
    position = 10, 100
    halign = left
    valign = bottom
}
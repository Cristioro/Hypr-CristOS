# /home/kaiserpc/.config/hypr/hyprland.conf
# Bootstrap: carga la configuración modular en Lua
source = ~/.config/hypr/hyprland.lua

# Arranque garantizado de la sesión. `exec-once` lo ejecuta Hyprland al
# iniciar la sesión, sin depender del evento Lua hyprland.start (que puede
# dispararse antes de que la config esté cargada). El script es idempotente y
# espera a que Hyprland esté listo, así que no duplica nada junto con la
# unidad systemd hypr-session.service.
exec-once = ~/.config/hypr/scripts/session-start.sh

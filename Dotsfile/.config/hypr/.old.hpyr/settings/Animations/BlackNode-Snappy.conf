-- BlackNode-Snappy (Hyprland Lua)
-- ----------------------------------------

hl.curve("fluent_decel", { type = "bezier", points = { {0, 0.2}, {0.4, 1} } })
hl.curve("easeOutExpo", { type = "bezier", points = { {0.16, 1}, {0.3, 1} } })
hl.curve("soft_bounce", { type = "bezier", points = { {0.05, 0.9}, {0.1, 1.05} } })
hl.curve("md3_standard", { type = "bezier", points = { {0.2, 0}, {0, 1} } })
hl.curve("quick_in", { type = "bezier", points = { {0.1, 0.9}, {0.2, 1} } })

hl.animation({ leaf = "windows", enabled = true, speed = 3, curve = "soft_bounce", style = "slide" })
hl.animation({ leaf = "windowsIn", enabled = true, speed = 3, curve = "soft_bounce", style = "slide" })
hl.animation({ leaf = "windowsOut", enabled = true, speed = 3, curve = "fluent_decel", style = "slide" })
hl.animation({ leaf = "windowsMove", enabled = true, speed = 3, curve = "soft_bounce", style = "slide" })

hl.animation({ leaf = "fadeIn", enabled = true, speed = 3, curve = "md3_standard" })
hl.animation({ leaf = "fadeOut", enabled = true, speed = 3, curve = "md3_standard" })
hl.animation({ leaf = "fadeSwitch", enabled = true, speed = 3, curve = "md3_standard" })
hl.animation({ leaf = "fadeShadow", enabled = true, speed = 3, curve = "md3_standard" })
hl.animation({ leaf = "fadeDim", enabled = true, speed = 3, curve = "md3_standard" })
hl.animation({ leaf = "fadeLayers", enabled = true, speed = 3, curve = "md3_standard" })

hl.animation({ leaf = "workspaces", enabled = true, speed = 4, curve = "quick_in", style = "slidevert" })
hl.animation({ leaf = "workspacesIn", enabled = true, speed = 4, curve = "quick_in", style = "slidevert" })
hl.animation({ leaf = "workspacesOut", enabled = true, speed = 4, curve = "quick_in", style = "slidevert" })

hl.animation({ leaf = "layers", enabled = true, speed = 3, curve = "easeOutExpo", style = "slide" })
hl.animation({ leaf = "layersIn", enabled = true, speed = 3, curve = "easeOutExpo", style = "slide" })
hl.animation({ leaf = "layersOut", enabled = true, speed = 3, curve = "easeOutExpo", style = "slide" })

hl.animation({ leaf = "border", enabled = true, speed = 10 })
hl.animation({ leaf = "borderangle", enabled = true, speed = 30, style = "loop" })
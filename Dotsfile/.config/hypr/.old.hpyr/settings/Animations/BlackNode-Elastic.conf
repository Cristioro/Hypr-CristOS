-- BlackNode-Elastic (Hyprland Lua)
-- ----------------------------------------

hl.curve("elastic", { type = "bezier", points = { {0.6, -0.28}, {0.735, 0.045} } })
hl.curve("bounceOut", { type = "bezier", points = { {0.175, 0.885}, {0.32, 1.275} } })
hl.curve("smooth", { type = "bezier", points = { {0.45, 0}, {0.55, 1} } })

hl.animation({ leaf = "windows", enabled = true, speed = 6, curve = "bounceOut", style = "slide" })
hl.animation({ leaf = "windowsIn", enabled = true, speed = 6, curve = "bounceOut", style = "slide top" })
hl.animation({ leaf = "windowsOut", enabled = true, speed = 5, curve = "elastic", style = "slide bottom" })
hl.animation({ leaf = "windowsMove", enabled = true, speed = 6, curve = "bounceOut", style = "slide" })

hl.animation({ leaf = "fadeIn", enabled = true, speed = 4, curve = "smooth" })
hl.animation({ leaf = "fadeOut", enabled = true, speed = 4, curve = "smooth" })

hl.animation({ leaf = "workspaces", enabled = true, speed = 5, curve = "bounceOut", style = "slide" })
hl.animation({ leaf = "workspacesIn", enabled = true, speed = 5, curve = "bounceOut", style = "slide" })
hl.animation({ leaf = "workspacesOut", enabled = true, speed = 5, curve = "smooth", style = "slide" })

hl.animation({ leaf = "layers", enabled = true, speed = 4, curve = "bounceOut", style = "slide" })
hl.animation({ leaf = "layersIn", enabled = true, speed = 4, curve = "bounceOut", style = "slide" })
hl.animation({ leaf = "layersOut", enabled = true, speed = 4, curve = "elastic", style = "slide" })
-- BlackNode-Linear (Hyprland Lua)
-- ----------------------------------------

hl.curve("linear", { type = "bezier", points = { {1, 1}, {1, 1} } })
hl.curve("decel", { type = "bezier", points = { {0.05, 0.7}, {0.1, 1} } })

hl.animation({ leaf = "windows", enabled = true, speed = 2, curve = "decel", style = "slide" })
hl.animation({ leaf = "windowsIn", enabled = true, speed = 2, curve = "decel", style = "slide" })
hl.animation({ leaf = "windowsOut", enabled = true, speed = 2, curve = "decel", style = "slide" })
hl.animation({ leaf = "windowsMove", enabled = true, speed = 2, curve = "decel", style = "slide" })

hl.animation({ leaf = "fadeIn", enabled = true, speed = 3, curve = "linear" })
hl.animation({ leaf = "fadeOut", enabled = true, speed = 3, curve = "linear" })

hl.animation({ leaf = "workspaces", enabled = true, speed = 3, curve = "decel", style = "slidevert" })
hl.animation({ leaf = "workspacesIn", enabled = true, speed = 3, curve = "decel", style = "slidevert" })
hl.animation({ leaf = "workspacesOut", enabled = true, speed = 3, curve = "decel", style = "slidevert" })

hl.animation({ leaf = "border", enabled = true, speed = 1, curve = "linear" })
hl.animation({ leaf = "borderangle", enabled = true, speed = 30, curve = "linear", style = "loop" })
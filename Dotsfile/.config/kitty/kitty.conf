# ==================== Configuración Kitty con Mica ====================

allow_remote_control yes

# Transparencia + Efecto Mica
background_opacity 0.82
background_blur 65
dynamic_background_opacity yes

# Color de fondo base (oscuro elegante)
# background #1e1e2e

# Padding interno (espacio alrededor del texto)
window_padding_width 14

# Fuente recomendada (cámbiala si quieres otra)
font_family JetBrainsMono Nerd Font
font_size 11

# Scrollback
scrollback_lines 10000

# Mejor rendimiento con blur
repaint_delay 8
sync_to_monitor yes

# Bordes y estilo
hide_window_decorations no
window_border_width 0

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# Copiar y pegar con mouse
copy_on_select yes
